name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust check
        run: pnpm check

      - name: Rust test
        run: pnpm test

      - name: Frontend typecheck
        run: pnpm --filter bonsai-frontend exec tsc --noEmit

      - name: Frontend test
        run: pnpm --filter bonsai-frontend test

      - name: Frontend lint
        run: pnpm --filter bonsai-frontend lint
