[package]
name = "bonsai"
version = "0.2.0"
description = "A desktop AI companion that grows with you"
edition = "2021"
rust-version = "1.77"

[lib]
name = "bonsai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
simplelog = "0.12"
ureq = { version = "2", features = ["json"] }
arboard = "3"
# Agent tool pipeline (plan-agent-mcp-skill.md §3): MCP client via the
# official SDK. Tokio is already Tauri's runtime — no second runtime.
tokio = { version = "1", features = ["macros", "time", "process"] }
rmcp = { version = "3.11", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
# Version-locked to rmcp's streamable-http-client-reqwest backend.
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# P3-2 文件工具（plan-files.md §3.6）：授权目录用系统目录选择器，不接受
# 手输路径（防注入任意路径）。AsyncFileDialog 在 Tauri 命令的 tokio 上下文
# 里安全（macOS 走 NSOpenPanel 主线程派发）。
rfd = "0.15"
# P3-3 Web 检索（plan-web.md）：URL 解析（validate_url 内核）+ 启发式正文
# 提取（scraper = html5ever 系）。代码库 HTTP 惯例是 ureq 同步客户端，
# 重定向控制走 redirects(0) 手动逐跳校验（plan §3.2 不变量 4）。
url = "2"
scraper = "0.29"
# G-05 增量：PDF 文本层抽取（docs/zh/plan-pdf-read/v1）。纯 Rust，无 pdfium。
pdf-extract = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
active-win-pos-rs = "0.9"
# EventKit read-only bridge (plan-calendar.md §3.3). Read access must be
# requested from THIS process — a helper binary would own a separate TCC
# identity and the app would still have no permission.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDate"] }
objc2-event-kit = { version = "0.3", features = [
    "EKObject",
    "EKTypes",
    "EKEventStore",
    "EKEvent",
    "EKCalendarItem",
    "EKCalendar",
    "EKParticipant",
] }
block2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
